# Docker for Linux
## Debian based systems
- name: Remove Docker old version (Debian based)
  shell: for pkg in docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc; do sudo apt-get remove -y $pkg; done
  ignore_errors: true
  tags: docker
  when:
    - ansible_os_family == "Debian"

- name: Install Docker package (Debian based)
  package:
    name:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    state: latest
  register: docker_installed
  tags: docker
  delay: 10
  when:
    - ansible_os_family == "Debian"

- name: Enable and run service (Debian based)
  shell: systemctl enable docker && systemctl start docker
  tags: docker
  when:
    - ansible_os_family == "Debian"
    - docker_installed.changed

### Install cri-docker (Debian based)
- name: Get cri-dockerd version
  shell: |
    curl -sL "https://github.com/Mirantis/cri-dockerd/releases/expanded_assets/v{{ cri_dockerd_version }}" | grep -oP 'cri-dockerd_\K[0-9.]+(?=\.3-0)' | head -1 || echo "{{ cri_dockerd_version }}"
  register: result_version
  changed_when: false
  tags: docker
  when:
    - ansible_os_family == "Debian"

- name: Set cri-dockerd version fact
  set_fact:
    version: "{{ result_version.stdout | default(cri_dockerd_version, true) }}"
  when:
    - ansible_os_family == "Debian"
    - result_version is defined

- set_fact:
    ansible_distribution: "Ubuntu"
  when: ansible_distribution == "Linux Mint"

- set_fact:
    ansible_distribution_release: >-
      {{ (ansible_distribution == 'Ubuntu') | ternary(
           {
             'tessa': 'bionic', 'tricia': 'bionic', 'tina': 'bionic', 'tara': 'bionic',
             'hera': 'bionic', 'juno': 'bionic',
             'ulyana': 'focal', 'ulyssa': 'focal', 'uma': 'focal', 'una': 'focal', 'odin': 'focal',
             'jammy': 'jammy', 'vanessa': 'jammy', 'vera': 'jammy', 'victoria': 'jammy', 'virginia': 'jammy'
           }.get(ansible_distribution_release | lower, 'jammy'),
           ansible_distribution_release
         ) }}
  tags: docker

- name: Install cri-docker (Debian based)
  apt:
     deb: https://github.com/Mirantis/cri-dockerd/releases/download/v{{ version }}/cri-dockerd_{{ version }}.3-0.{{ ansible_distribution | lower }}-{{ ansible_distribution_release }}_amd64.deb
  tags: docker
  register: cri_docker_install
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture == "x86_64"
    - version is defined and version | length > 0
  failed_when: false

- name: Install cri-docker (Debian based)
  apt:
     deb: https://github.com/Mirantis/cri-dockerd/releases/download/v{{ version }}/cri-dockerd_{{ version }}.3-0.{{ ansible_distribution | lower }}-{{ ansible_distribution_release }}_arm64.deb
  tags: docker
  register: cri_docker_install
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture == "arm64"
    - version is defined and version | length > 0
  failed_when: false

# Docker for MacOS
- name: Install Docker Bundle from Brew (for MacOS)
  homebrew:
    name: "{{ packages }}"
  vars:
    packages:
      - 'boot2docker'
      - 'docker'
      - 'docker-buildx'
      - 'docker-clean'
      - 'docker-completion'
      - 'docker-compose'
      - 'docker-machine'
    state: present
  tags: docker
  when:
    - ansible_os_family == "Darwin"
