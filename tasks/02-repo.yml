---
- set_fact:
    ansible_distribution: "Ubuntu"
  when: ansible_facts["distribution"] == "Linux Mint"

- set_fact:
    docker_repo_distribution: >-
      {{ (ansible_facts["distribution"] == 'Linux Mint') | ternary('ubuntu', ansible_facts["distribution"]) | lower }}

- set_fact:
    ansible_distribution_release: >-
      {{ {
           'tessa': 'bionic', 'tricia': 'bionic', 'tina': 'bionic', 'tara': 'bionic',
           'hera': 'bionic', 'juno': 'bionic',
           'ulyana': 'focal', 'ulyssa': 'focal', 'uma': 'focal', 'una': 'focal', 'odin': 'focal',
           'vanessa': 'jammy', 'vera': 'jammy', 'victoria': 'jammy', 'virginia': 'jammy',
           'wilma': 'noble', 'xia': 'noble', 'zara': 'noble', 'zena': 'noble'
         }.get(ansible_facts["distribution_release"] | lower, ansible_facts["distribution_release"] | lower) }}

- name: Configure Docker repository
  block:
    - name: Ensure Docker apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Find stale Docker apt source files
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: 'docker*'
        file_type: file
      register: docker_source_files

    - name: Remove stale Docker apt source files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ docker_source_files.files }}"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /tmp/docker.gpg
        mode: '0644'

    - name: Dearmor Docker GPG key
      ansible.builtin.command:
        cmd: gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /tmp/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set permissions on Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        mode: '0644'

    - name: Add docker apt repo (amd64)
      deb822_repository:
        name: docker
        types: [deb]
        architectures: [amd64]
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        uris: ["https://download.docker.com/linux/{{ docker_repo_distribution }}"]
        signed_by: /etc/apt/keyrings/docker.gpg
        state: present
      when:
        - docker_repo_distribution == "ubuntu"
        - ansible_facts["architecture"] == "x86_64"

    - name: Add docker apt repo (arm64)
      deb822_repository:
        name: docker
        types: [deb]
        architectures: [arm64]
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        uris: ["https://download.docker.com/linux/{{ docker_repo_distribution }}"]
        signed_by: /etc/apt/keyrings/docker.gpg
        state: present
      when:
        - docker_repo_distribution == "ubuntu"
        - ansible_facts["architecture"] == "aarch64"

    - name: Add docker apt repo (armhf)
      deb822_repository:
        name: docker-armhf
        types: [deb]
        architectures: [armhf]
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        uris: ["https://download.docker.com/linux/{{ docker_repo_distribution }}"]
        signed_by: /etc/apt/keyrings/docker.gpg
        state: present
      when:
        - docker_repo_distribution == "ubuntu"
        - ansible_facts["architecture"] == "armv7l"
  when:
    - ansible_facts["os_family"] == "Debian"

- name: apt-get update
  shell: apt-get update
  ignore_errors: true
  when:
    - ansible_facts["os_family"] == "Debian"
