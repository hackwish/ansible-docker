- name: Install Docker dependencies on Debian based systems
  apt:
    name: "{{ packages }}"
  vars:
    packages:
    - ca-certificates
    - curl
    - gnupg
    - lsb-release
    update_cache: yes
  when:
    - ansible_facts["os_family"] == "Debian"

# Install brew dependencies on MacOS 
- name: Install Docker dependencies on MacOS
  homebrew:
    name: "{{ packages }}"
  vars:
    packages:
    - 'go'
    - 'go-md2man'
  when:
    - ansible_facts["os_family"] == "Darwin"