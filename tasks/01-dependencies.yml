- name: Install Docker dependencies on Debian based systems
  apt:
    name: "{{ packages }}"
  vars:
    packages:
    - apt-transport-https
    - ca-certificates
    - curl
    - gnupg
    - gnupg-agent
    - software-properties-common
    - gnupg2
    - bridge-utils
    update_cache: yes
  when:
    - ansible_facts["os_family"] == "Debian"

# Install brew dependencies on MacOS 
- name: Install Docker dependencies on MacOS
  homebrew:
    name: "{{ packages }}"
  register: brew_result
  failed_when: brew_result.msg is defined and "already installed" not in brew_result.msg
  vars:
    packages:
    - 'go'
    - 'go-md2man'
  when:
    - ansible_facts["os_family"] == "Darwin"